name: vibebug_flutter
description: Crash and exception reporting for Flutter apps — sends issues to Vibe Bug Tracker.
version: 0.2.3
homepage: https://vibebugtracker.com
repository: https://github.com/adnanpk44/visualIssueTracker
issue_tracker: https://github.com/adnanpk44/visualIssueTracker/issues

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
