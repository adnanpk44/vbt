name: vibebug_flutter
description: Crash reporting and visual bug capture for Flutter apps — reports issues to Vibe Bug Tracker with screenshots, widget selectors, and an offline queue.
version: 0.4.7
homepage: https://vibebugtracker.com
repository: https://github.com/adnanpk44/vbt
issue_tracker: https://github.com/adnanpk44/vbt/issues
documentation: https://vibebugtracker.com/docs/flutter
topics:
  - flutter
  - crash-reporting
  - bug-tracking
  - debugging
  - visual-bug-reporting

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
